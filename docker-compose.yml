# Sized for 4 vCPU / 8 GiB. Az CLI is the RAM hog (~150–250MB per process).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_connections=80
      - -c
      - huge_pages=off
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
    shm_size: 256mb
    mem_limit: 1g
    volumes:
      - portal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 192m
    volumes:
      - portal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      PORTAL_THREAD_POOL: "16"
      PORTAL_AZ_CLI_CONCURRENCY: "12"
      PORTAL_AZURE_SYNC_CONCURRENCY: "8"
      PORTAL_DEPLOY_JOBS: "12"
      PORTAL_DEPLOY_JOBS_MAX: "16"
    mem_limit: 4g
    volumes:
      - ./scripts:/app/scripts:ro
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./secrets/telegram-webhook.crt:/etc/nginx/certs/telegram-webhook.crt:ro
      - ./secrets/telegram-webhook.key:/etc/nginx/certs/telegram-webhook.key:ro

volumes:
  portal_db_data:
  portal_redis_data:
